<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un — le Pokédex des stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --bg-hover: #F7F6F3;
    --text: #37352F;
    --text-light: #9B9A97;
    --text-lighter: #B5B4B0;
    --border: #E9E9E7;
    --border-strong: #D9D8D4;
    --dark: #2F2E2B;
    --dark-hover: #171716;
    --radius: 6px;
    --radius-lg: 10px;
    --shadow: 0 1px 2px rgba(15,15,15,0.06), 0 3px 12px rgba(15,15,15,0.06);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea{ font-family: inherit; }

  #app{ max-width: 760px; margin: 0 auto; min-height: 100vh; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
  }
  .brand{
    font-size: 1.05rem; font-weight: 600; color: var(--text);
    display:flex; align-items:center; gap:8px;
  }
  .brand-dot{ color: var(--text-lighter); font-weight: 700; }
  nav{ display:flex; gap: 4px; }
  .nav-btn{
    border: none; background: transparent;
    padding: 7px 12px; border-radius: var(--radius);
    color: var(--text-light); font-weight: 500; font-size: 0.88rem;
    display:flex; align-items:center; gap:6px;
    transition: background 100ms ease, color 100ms ease;
  }
  .nav-btn:hover{ background: var(--bg-hover); color: var(--text); }
  .nav-btn.active{ background: var(--bg-hover); color: var(--text); font-weight: 600; }
  #countBadge{
    color: var(--text-lighter); font-size: 0.8rem; font-weight: 500;
  }
  .nav-btn.active #countBadge{ color: var(--text-light); }

  main{ padding: 40px 24px 80px; }
  .screen{ animation: fadeIn 200ms ease; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- Add screen ---------- */
  .add-hero{ max-width: 480px; margin: 0 auto 28px; }
  .add-hero h1{
    font-size: 1.7rem; font-weight: 700; margin: 0 0 6px; line-height:1.25;
    color: var(--text);
  }
  .add-hero .subtitle{ color: var(--text-light); font-size: 0.95rem; margin:0; line-height:1.5; }

  .page-card{
    max-width: 480px;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 8px 20px 24px;
  }

  .property-row{
    display:flex; align-items:center;
    border-bottom: 1px solid var(--border);
    padding: 12px 2px;
    gap: 10px;
  }
  .property-label{
    width: 110px; flex-shrink: 0;
    color: var(--text-light); font-size: 0.85rem; font-weight: 500;
    display:flex; align-items:center; gap:8px;
  }
  .property-icon{ font-size: 0.85rem; color: var(--text-lighter); width:16px; text-align:center; }
  .property-row input{
    flex:1; min-width: 0;
    border: none; background: transparent;
    font-size: 0.92rem; color: var(--text);
    padding: 4px 6px; border-radius: 4px;
    outline: none;
  }
  .property-row input:focus{ background: var(--bg-hover); }

  .description-block{ padding: 16px 2px 4px; }
  .block-label{ color: var(--text-light); font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; }
  .description-block textarea{
    width: 100%; border: none; background: transparent;
    font-size: 0.92rem; color: var(--text); line-height:1.55;
    resize: vertical; min-height: 64px; padding: 6px; border-radius:4px;
    outline: none;
  }
  .description-block textarea:focus{ background: var(--bg-hover); }
  .description-block textarea::placeholder{ color: var(--text-lighter); }

  .btn{
    border: none; border-radius: var(--radius);
    padding: 9px 16px; font-weight: 600; font-size: 0.88rem;
    transition: background 100ms ease;
  }
  .btn-primary{ background: var(--dark); color: #fff; }
  .btn-primary:hover{ background: var(--dark-hover); }
  .btn-primary:disabled{ opacity: 0.5; cursor: default; }
  .btn-ghost{ background: transparent; color: var(--text-light); }
  .btn-ghost:hover{ background: var(--bg-hover); color: var(--text); }
  .btn-danger{ background: transparent; color: #C4554D; }
  .btn-danger:hover{ background: #FBEEEC; }

  .form-footer{ padding-top: 18px; }

  .photo-status{
    font-size: 0.83rem; color: var(--text-light); padding: 4px 2px 0;
  }

  .manual-photo-zone{
    margin-top: 14px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display:flex; flex-direction:column; gap: 10px;
  }
  .manual-photo-zone p{ margin:0; font-size: 0.85rem; color: var(--text); }
  input[type=file]{ font-size: 0.82rem; color: var(--text-light); }
  .manual-preview{
    width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .manual-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- Gallery ---------- */
  .empty-state{
    text-align:center; color: var(--text-light); margin-top: 80px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .empty-state p{ font-size: 0.95rem; }

  .month-group{ margin-bottom: 36px; }
  .month-header{
    font-size: 0.92rem; font-weight: 600; color: var(--text);
    margin: 0 0 14px 2px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 58px;
    background: var(--bg);
    z-index: 5;
  }
  .month-count{ color: var(--text-lighter); font-weight: 400; }
  .card-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .star-card{
    border: 1px solid var(--border); padding:0; text-align:left;
    background: var(--bg);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display:flex; flex-direction:column;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .star-card:hover{ border-color: var(--border-strong); box-shadow: var(--shadow); }

  .card-photo-wrap{
    display:block; aspect-ratio: 1/1; width:100%;
    background: var(--bg-hover);
    overflow:hidden;
  }
  .card-photo-wrap img{ width:100%; height:100%; object-fit: cover; display:block; }
  .card-footer{
    padding: 10px 12px 12px;
    display:flex; flex-direction:column; gap:2px;
  }
  .card-name{ font-weight: 600; font-size: 0.87rem; color: var(--text); line-height:1.3; }
  .card-date{ font-size: 0.78rem; color: var(--text-lighter); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(15,15,15,0.45);
    display:flex; align-items:center; justify-content:center;
    padding: 20px; z-index: 50;
  }
  .modal{
    background: var(--bg); border-radius: var(--radius-lg);
    padding: 22px 20px; max-width: 420px; width:100%;
    max-height: 90vh; overflow-y:auto;
    box-shadow: 0 8px 30px rgba(15,15,15,0.18);
    position: relative;
    border: 1px solid var(--border);
  }
  .modal-close{
    position:absolute; top:12px; right:12px;
    background: transparent; border:none; border-radius: var(--radius);
    width:28px; height:28px; font-size:1.1rem; line-height:1;
    color: var(--text-light);
  }
  .modal-close:hover{ background: var(--bg-hover); color: var(--text); }
  .modal-photo-wrap{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin-bottom: 12px; padding-top: 4px;
  }
  #modalPhoto{
    width: 88px; height: 88px; object-fit: cover; border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .change-photo-label{
    font-size: 0.8rem; font-weight: 500; color: var(--text-light); cursor:pointer;
  }
  .change-photo-label:hover{ color: var(--text); }
  #editForm{ display:flex; flex-direction:column; }
  .modal-actions{ display:flex; gap:8px; justify-content:space-between; margin-top:16px; }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--dark); color: #fff;
    padding: 10px 18px; border-radius: var(--radius); font-weight:500; font-size: 0.88rem;
    box-shadow: 0 4px 16px rgba(15,15,15,0.25); z-index: 60;
    animation: toastIn 180ms ease;
  }
  @keyframes toastIn{ from{ opacity:0; transform: translate(-50%, 8px);} to{ opacity:1; transform: translate(-50%,0);} }

  [hidden]{ display:none !important; }

  @media (max-width: 480px){
    .add-hero h1{ font-size: 1.4rem; }
    .month-header{ top: 52px; }
    main{ padding: 28px 16px 60px; }
    .page-card{ padding: 6px 14px 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">Un <span class="brand-dot">·</span> <span style="color:var(--text-light); font-weight:400;">Pokédex des stars</span></div>
    <nav>
      <button id="navAdd" class="nav-btn active">Capturer</button>
      <button id="navGallery" class="nav-btn">Mon Pokédex <span id="countBadge">0</span></button>
    </nav>
  </header>

  <main>
    <section id="screenAdd" class="screen">
      <div class="add-hero">
        <h1>Nouvelle rencontre</h1>
        <p class="subtitle">Note qui tu as croisé, et laisse "Un" retrouver sa photo sur Wikipédia.</p>
      </div>

      <form id="addForm" class="page-card">
        <div class="properties">
          <div class="property-row">
            <div class="property-label"><span class="property-icon">Aa</span>Prénom</div>
            <input required id="firstName" type="text" placeholder="Marion" autocomplete="off">
          </div>
          <div class="property-row">
            <div class="property-label"><span class="property-icon">Aa</span>Nom</div>
            <input required id="lastName" type="text" placeholder="Cotillard" autocomplete="off">
          </div>
          <div class="property-row">
            <div class="property-label"><span class="property-icon">📅</span>Date</div>
            <input required id="metDate" type="date">
          </div>
        </div>

        <div class="description-block">
          <div class="block-label">Description</div>
          <textarea id="description" rows="3" placeholder="Ajouter une description... (facultatif)"></textarea>
        </div>

        <div id="photoStatus" class="photo-status" hidden></div>

        <div id="manualPhotoZone" class="manual-photo-zone" hidden>
          <p>Aucune photo trouvée sur Wikipédia. Tu peux en ajouter une toi-même :</p>
          <input type="file" id="manualPhotoInput" accept="image/*">
          <div id="manualPreviewWrap"></div>
          <div class="manual-actions">
            <button type="button" id="confirmManualBtn" class="btn btn-primary">Valider la carte</button>
            <button type="button" id="cancelManualBtn" class="btn btn-ghost">Annuler</button>
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" id="submitBtn" class="btn btn-primary">Ajouter au Pokédex</button>
        </div>
      </form>
    </section>

    <section id="screenGallery" class="screen" hidden>
      <div id="galleryEmpty" class="empty-state" hidden>
        <p>Ton Pokédex est vide pour l'instant.</p>
        <button class="btn btn-primary" id="emptyAddBtn">Capturer ma première star</button>
      </div>
      <div id="galleryContent"></div>
    </section>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal">
    <button id="modalClose" class="modal-close" type="button" aria-label="Fermer">×</button>
    <form id="editForm">
      <div class="modal-photo-wrap">
        <img id="modalPhoto" src="" alt="">
        <label class="change-photo-label">Changer la photo
          <input type="file" id="modalPhotoInput" accept="image/*" hidden>
        </label>
      </div>
      <div class="property-row">
        <div class="property-label"><span class="property-icon">Aa</span>Prénom</div>
        <input required id="editFirstName" type="text">
      </div>
      <div class="property-row">
        <div class="property-label"><span class="property-icon">Aa</span>Nom</div>
        <input required id="editLastName" type="text">
      </div>
      <div class="property-row">
        <div class="property-label"><span class="property-icon">📅</span>Date</div>
        <input required id="editDate" type="date">
      </div>
      <div class="description-block">
        <div class="block-label">Description</div>
        <textarea id="editDescription" rows="3" placeholder="Ajouter une description..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" id="deleteBtn" class="btn btn-danger">Supprimer</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
  const STORAGE_KEY = 'un_pokedex_stars_v1';
  const AVATAR_COLORS = ['#FFE2DD','#FBF3DB','#DDEDEA','#D3E5EF','#EAE4F2','#FCE2F1','#FDE7D0','#E3E8E4'];
  const AVATAR_TEXT = '#44403C';

  let pendingStar = null;
  let pendingPhotoDataUrl = null;
  let editingId = null;
  let editingPhotoOverride = null;

  // ---------- storage ----------
  function loadStars(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }catch(e){ return []; }
  }
  function persistStars(stars){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stars));
  }
  function saveStar(star){
    const stars = loadStars();
    stars.push({
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
      firstName: star.firstName,
      lastName: star.lastName,
      date: star.date,
      description: star.description || '',
      photoUrl: star.photoUrl || null
    });
    persistStars(stars);
    renderGallery();
  }

  // ---------- helpers ----------
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function hashColor(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
    return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
  }
  function capitalize(str){
    return str.charAt(0).toUpperCase() + str.slice(1);
  }
  function generateInitialsAvatar(firstName, lastName, color){
    const initials = ((firstName[0]||'') + (lastName[0]||'')).toUpperCase();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
      <rect width="300" height="300" fill="${color}"/>
      <text x="150" y="185" font-family="Inter, sans-serif" font-size="100" font-weight="600"
        fill="${AVATAR_TEXT}" text-anchor="middle">${initials}</text>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  // ---------- Wikipedia lookup ----------
  async function searchWikipediaPhoto(query){
    try{
      const searchRes = await fetch(`https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
      if(!searchRes.ok) return null;
      const searchData = await searchRes.json();
      const title = searchData && searchData.query && searchData.query.search && searchData.query.search[0] && searchData.query.search[0].title;
      if(!title) return null;
      const summaryRes = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
      if(!summaryRes.ok) return null;
      const summaryData = await summaryRes.json();
      return (summaryData.thumbnail && summaryData.thumbnail.source) ||
             (summaryData.originalimage && summaryData.originalimage.source) || null;
    }catch(e){
      return null;
    }
  }

  // ---------- navigation ----------
  function switchScreen(name){
    const isAdd = name === 'add';
    document.getElementById('screenAdd').hidden = !isAdd;
    document.getElementById('screenGallery').hidden = isAdd;
    document.getElementById('navAdd').classList.toggle('active', isAdd);
    document.getElementById('navGallery').classList.toggle('active', !isAdd);
    if(!isAdd) renderGallery();
  }
  document.getElementById('navAdd').addEventListener('click', () => switchScreen('add'));
  document.getElementById('navGallery').addEventListener('click', () => switchScreen('gallery'));
  document.getElementById('emptyAddBtn').addEventListener('click', () => switchScreen('add'));

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
  }

  // ---------- add form ----------
  function showPhotoStatus(msg){
    const el = document.getElementById('photoStatus');
    el.textContent = msg;
    el.hidden = false;
  }
  function hidePhotoStatus(){
    document.getElementById('photoStatus').hidden = true;
  }
  function hideManualZone(){
    document.getElementById('manualPhotoZone').hidden = true;
    document.getElementById('manualPhotoInput').value = '';
    document.getElementById('manualPreviewWrap').innerHTML = '';
    hidePhotoStatus();
  }
  function resetForm(){
    document.getElementById('addForm').reset();
    document.getElementById('metDate').value = new Date().toISOString().slice(0,10);
    hideManualZone();
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const date = document.getElementById('metDate').value;
    const description = document.getElementById('description').value.trim();
    if(!firstName || !lastName || !date) return;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Recherche de la photo...';
    showPhotoStatus('Recherche sur Wikipédia...');

    const photoUrl = await searchWikipediaPhoto(`${firstName} ${lastName}`);

    if(photoUrl){
      saveStar({ firstName, lastName, date, description, photoUrl });
      resetForm();
      showToast(`${firstName} ${lastName} a rejoint le Pokédex`);
    }else{
      pendingStar = { firstName, lastName, date, description };
      pendingPhotoDataUrl = null;
      showPhotoStatus('Aucune photo trouvée sur Wikipédia.');
      document.getElementById('manualPhotoZone').hidden = false;
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Ajouter au Pokédex';
  });

  document.getElementById('manualPhotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingPhotoDataUrl = reader.result;
      document.getElementById('manualPreviewWrap').innerHTML =
        `<img src="${reader.result}" class="manual-preview" alt="Aperçu">`;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('confirmManualBtn').addEventListener('click', () => {
    if(!pendingStar) return;
    saveStar({ ...pendingStar, photoUrl: pendingPhotoDataUrl });
    const name = `${pendingStar.firstName} ${pendingStar.lastName}`;
    pendingStar = null; pendingPhotoDataUrl = null;
    resetForm();
    showToast(`${name} a rejoint le Pokédex`);
  });

  document.getElementById('cancelManualBtn').addEventListener('click', () => {
    pendingStar = null; pendingPhotoDataUrl = null;
    hideManualZone();
  });

  // ---------- gallery ----------
  function cardHTML(s){
    const color = hashColor(s.firstName + s.lastName);
    const photo = s.photoUrl || generateInitialsAvatar(s.firstName, s.lastName, color);
    const dateLabel = new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'short' }).format(new Date(s.date + 'T00:00:00'));
    return `
      <button type="button" class="star-card" data-id="${s.id}">
        <span class="card-photo-wrap"><img src="${photo}" alt="${escapeHtml(s.firstName)} ${escapeHtml(s.lastName)}" loading="lazy"></span>
        <span class="card-footer">
          <span class="card-name">${escapeHtml(s.firstName)} ${escapeHtml(s.lastName)}</span>
          <span class="card-date">${dateLabel}</span>
        </span>
      </button>
    `;
  }

  function renderGallery(){
    const stars = loadStars();
    document.getElementById('countBadge').textContent = stars.length;

    const empty = document.getElementById('galleryEmpty');
    const grid = document.getElementById('galleryContent');
    empty.hidden = stars.length > 0;
    grid.hidden = stars.length === 0;
    if(stars.length === 0){ grid.innerHTML = ''; return; }

    const groups = {};
    stars.forEach(s => {
      const d = new Date(s.date + 'T00:00:00');
      const key = `${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')}`;
      if(!groups[key]){
        groups[key] = {
          label: capitalize(new Intl.DateTimeFormat('fr-FR', { month:'long', year:'numeric' }).format(d)),
          items: []
        };
      }
      groups[key].items.push(s);
    });

    const orderedKeys = Object.keys(groups).sort((a,b) => b.localeCompare(a));
    grid.innerHTML = orderedKeys.map(key => {
      const g = groups[key];
      g.items.sort((a,b) => new Date(b.date) - new Date(a.date));
      return `
        <div class="month-group">
          <h2 class="month-header">${g.label} <span class="month-count">(${g.items.length})</span></h2>
          <div class="card-grid">${g.items.map(cardHTML).join('')}</div>
        </div>
      `;
    }).join('');

    grid.querySelectorAll('.star-card').forEach(el => {
      el.addEventListener('click', () => openEditModal(el.dataset.id));
    });
  }

  // ---------- edit modal ----------
  function openEditModal(id){
    const stars = loadStars();
    const star = stars.find(s => s.id === id);
    if(!star) return;
    editingId = id;
    editingPhotoOverride = null;

    document.getElementById('editFirstName').value = star.firstName;
    document.getElementById('editLastName').value = star.lastName;
    document.getElementById('editDate').value = star.date;
    document.getElementById('editDescription').value = star.description || '';
    const color = hashColor(star.firstName + star.lastName);
    document.getElementById('modalPhoto').src = star.photoUrl || generateInitialsAvatar(star.firstName, star.lastName, color);

    document.getElementById('modalOverlay').hidden = false;
  }
  function closeModal(){
    document.getElementById('modalOverlay').hidden = true;
    editingId = null;
    editingPhotoOverride = null;
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'modalOverlay') closeModal();
  });

  document.getElementById('modalPhotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      editingPhotoOverride = reader.result;
      document.getElementById('modalPhoto').src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('editForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if(!editingId) return;
    const stars = loadStars();
    const idx = stars.findIndex(s => s.id === editingId);
    if(idx === -1) return;

    stars[idx] = {
      ...stars[idx],
      firstName: document.getElementById('editFirstName').value.trim(),
      lastName: document.getElementById('editLastName').value.trim(),
      date: document.getElementById('editDate').value,
      description: document.getElementById('editDescription').value.trim(),
      photoUrl: editingPhotoOverride || stars[idx].photoUrl
    };
    persistStars(stars);
    closeModal();
    renderGallery();
    showToast('Carte mise à jour');
  });

  document.getElementById('deleteBtn').addEventListener('click', () => {
    if(!editingId) return;
    if(!confirm('Supprimer cette carte du Pokédex ?')) return;
    const stars = loadStars().filter(s => s.id !== editingId);
    persistStars(stars);
    closeModal();
    renderGallery();
    showToast('Carte supprimée');
  });

  // ---------- init ----------
  document.getElementById('metDate').value = new Date().toISOString().slice(0,10);
  switchScreen('add');
  renderGallery();
</script>
</body>
</html>

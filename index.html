<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokéstar — le Pokédex des stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF9F4;
    --bg-card: #FFFFFF;
    --bg-hover: #FFF1E6;
    --text: #201A16;
    --text-light: #7A7168;
    --text-lighter: #B0A79C;
    --border: #F0E4D8;
    --border-strong: #E4D3C0;
    --accent-1: #FF6B4A;
    --accent-2: #FFB86B;
    --accent: #FF6B4A;
    --accent-soft: #FFEDE3;
    --radius: 10px;
    --radius-lg: 16px;
    --radius-xl: 22px;
    --shadow: 0 10px 30px rgba(255,107,74,0.10), 0 2px 8px rgba(32,26,22,0.05);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(circle at 8% 8%, rgba(255,184,107,0.20) 0, transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(126,232,203,0.18) 0, transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(255,107,74,0.10) 0, transparent 45%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea{ font-family: inherit; }
  h1, .brand, .toggle-option{ font-family: 'Space Grotesk', sans-serif; }

  #app{ max-width: 820px; margin: 0 auto; min-height: 100vh; }

  /* ---------- Top bar ---------- */
  .topbar{
    padding: 26px 24px 0;
    position: sticky; top:0; z-index: 20;
    background: rgba(255,249,244,0.82);
    backdrop-filter: blur(10px);
  }
  .brand{
    text-align:center;
    font-size: 1.2rem; font-weight: 600; color: var(--text);
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-bottom: 18px;
  }
  .brand-star{
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .toggle-switch{
    position: relative;
    display:flex;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    width: 100%;
    max-width: 320px;
    margin: 0 auto 20px;
  }
  .toggle-option{
    flex: 1 1 50%;
    position: relative; z-index: 2;
    border:none; background: transparent;
    padding: 10px 14px; border-radius: 999px;
    font-weight: 600; font-size: 0.9rem;
    color: var(--text-light);
    transition: color 220ms ease;
    display:flex; align-items:center; justify-content:center; gap:6px;
    white-space: nowrap;
  }
  .toggle-option.active{ color: #fff; }
  .toggle-option .toggle-count{ font-weight: 500; opacity: 0.9; font-size: 0.82rem; }
  .toggle-indicator{
    position:absolute; top:4px; left:4px;
    height: calc(100% - 8px); width: calc(50% - 4px);
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-radius: 999px;
    transition: transform 320ms cubic-bezier(.4,0,.2,1);
    z-index: 1;
    box-shadow: 0 6px 16px rgba(255,107,74,0.30);
  }
  .toggle-indicator.pos-1{ transform: translateX(100%); }

  main{ padding: 8px 24px 80px; }
  .screen{ animation: fadeIn 220ms ease; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- Add screen ---------- */
  .add-hero{ max-width: 480px; margin: 16px auto 24px; text-align:center; }
  .add-hero h1{
    font-size: 1.8rem; font-weight: 600; margin: 0 0 6px; line-height:1.25;
    color: var(--text);
  }
  .add-hero .subtitle{ color: var(--text-light); font-size: 0.95rem; margin:0; line-height:1.5; }

  .page-card{
    max-width: 480px;
    margin: 0 auto;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 10px 22px 26px;
    box-shadow: var(--shadow);
  }

  .property-row{
    display:flex; align-items:center;
    border-bottom: 1px solid var(--border);
    padding: 13px 2px;
    gap: 10px;
  }
  .property-label{
    width: 110px; flex-shrink: 0;
    color: var(--text-light); font-size: 0.85rem; font-weight: 500;
    display:flex; align-items:center; gap:8px;
  }
  .property-icon{ font-size: 0.85rem; color: var(--text-lighter); width:16px; text-align:center; }
  .property-row input{
    flex:1; min-width: 0;
    border: none; background: transparent;
    font-size: 0.92rem; color: var(--text);
    padding: 4px 6px; border-radius: var(--radius);
    outline: none;
  }
  .property-row input:focus{ background: var(--accent-soft); }

  .description-block{ padding: 16px 2px 4px; }
  .block-label{ color: var(--text-light); font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; }
  .description-block textarea{
    width: 100%; border: none; background: transparent;
    font-size: 0.92rem; color: var(--text); line-height:1.55;
    resize: vertical; min-height: 64px; padding: 6px; border-radius: var(--radius);
    outline: none;
  }
  .description-block textarea:focus{ background: var(--accent-soft); }
  .description-block textarea::placeholder{ color: var(--text-lighter); }

  .btn{
    border: none; border-radius: 999px;
    padding: 11px 20px; font-weight: 600; font-size: 0.9rem;
    transition: filter 140ms ease, transform 100ms ease, background 140ms ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    box-shadow: 0 8px 20px rgba(255,107,74,0.28);
  }
  .btn-primary:hover{ filter: brightness(1.05); }
  .btn-primary:disabled{ opacity: 0.5; cursor: default; }
  .btn-ghost{ background: transparent; color: var(--text-light); }
  .btn-ghost:hover{ background: var(--bg-hover); color: var(--text); }
  .btn-danger{ background: transparent; color: #D1503F; }
  .btn-danger:hover{ background: #FDEAE4; }

  .form-footer{ padding-top: 18px; }

  .photo-status{
    font-size: 0.83rem; color: var(--text-light); padding: 4px 2px 0;
  }

  .manual-photo-zone{
    margin-top: 14px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display:flex; flex-direction:column; gap: 10px;
  }
  .manual-photo-zone p{ margin:0; font-size: 0.85rem; color: var(--text); }
  input[type=file]{ font-size: 0.82rem; color: var(--text-light); }
  .manual-preview{
    width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .manual-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- Gallery ---------- */
  .empty-state{
    text-align:center; color: var(--text-light); margin-top: 60px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .empty-state p{ font-size: 0.95rem; }

  .month-group{ margin-bottom: 34px; }
  .month-header{
    font-size: 0.92rem; font-weight: 600; color: var(--text);
    margin: 0 0 14px 2px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 116px;
    background: var(--bg);
    z-index: 5;
  }
  .month-count{ color: var(--text-lighter); font-weight: 400; }

  .card-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .star-card{
    border: 1px solid var(--border); padding:0; text-align:left;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display:flex; flex-direction:column;
    transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
  }
  .star-card:hover{ border-color: var(--border-strong); box-shadow: var(--shadow); transform: translateY(-2px); }

  .card-photo-wrap{
    display:block; aspect-ratio: 1/1; width:100%;
    background: var(--bg-hover);
    overflow:hidden;
  }
  .card-photo-wrap img{ width:100%; height:100%; object-fit: cover; display:block; }
  .card-footer{
    padding: 9px 10px 11px;
    display:flex; flex-direction:column; gap:2px;
  }
  .card-name{ font-weight: 600; font-size: 0.82rem; color: var(--text); line-height:1.3; }
  .card-date{ font-size: 0.74rem; color: var(--text-lighter); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(32,26,22,0.45);
    display:flex; align-items:center; justify-content:center;
    padding: 20px; z-index: 50;
  }
  .modal{
    background: var(--bg-card); border-radius: var(--radius-xl);
    padding: 22px 20px; max-width: 420px; width:100%;
    max-height: 90vh; overflow-y:auto;
    box-shadow: 0 20px 50px rgba(32,26,22,0.20);
    position: relative;
    border: 1px solid var(--border);
  }
  .modal-close{
    position:absolute; top:12px; right:12px;
    background: transparent; border:none; border-radius: var(--radius);
    width:28px; height:28px; font-size:1.1rem; line-height:1;
    color: var(--text-light);
  }
  .modal-close:hover{ background: var(--bg-hover); color: var(--text); }
  .modal-photo-wrap{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin-bottom: 12px; padding-top: 4px;
  }
  #modalPhoto{
    width: 88px; height: 88px; object-fit: cover; border-radius: var(--radius-lg);
    border: 1px solid var(--border);
  }
  .change-photo-label{
    font-size: 0.8rem; font-weight: 500; color: var(--accent-1); cursor:pointer;
  }
  .change-photo-label:hover{ color: #E85A3B; }
  #editForm{ display:flex; flex-direction:column; }
  .modal-actions{ display:flex; gap:8px; justify-content:space-between; margin-top:16px; }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-weight:500; font-size: 0.88rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22); z-index: 60;
    animation: toastIn 200ms ease;
  }
  @keyframes toastIn{ from{ opacity:0; transform: translate(-50%, 8px);} to{ opacity:1; transform: translate(-50%,0);} }

  [hidden]{ display:none !important; }

  @media (max-width: 720px){
    .card-grid{ grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 520px){
    .card-grid{ grid-template-columns: repeat(2, 1fr); }
    .add-hero h1{ font-size: 1.45rem; }
    .month-header{ top: 100px; }
    main{ padding: 6px 16px 60px; }
    .topbar{ padding: 20px 16px 0; }
    .page-card{ padding: 8px 14px 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-star">✦</span> Pokéstar</div>
    <div class="toggle-switch" id="screenToggle">
      <div class="toggle-indicator" id="toggleIndicator"></div>
      <button type="button" class="toggle-option active" id="navAdd">Ajouter</button>
      <button type="button" class="toggle-option" id="navGallery">Pokédex <span class="toggle-count" id="countBadge">0</span></button>
    </div>
  </header>

  <main>
    <section id="screenAdd" class="screen">
      <div class="add-hero">
        <h1>Nouvelle rencontre</h1>
        <p class="subtitle">Note qui tu as croisé, et laisse Pokéstar retrouver sa photo sur Wikipédia.</p>
      </div>

      <form id="addForm" class="page-card">
        <div class="properties">
          <div class="property-row">
            <div class="property-label"><span class="property-icon">Aa</span>Nom</div>
            <input required id="fullName" type="text" placeholder="Marion Cotillard" autocomplete="off">
          </div>
          <div class="property-row">
            <div class="property-label"><span class="property-icon">📅</span>Date</div>
            <input required id="metDate" type="date">
          </div>
        </div>

        <div class="description-block">
          <div class="block-label">Description</div>
          <textarea id="description" rows="3" placeholder="Ajouter une description... (facultatif)"></textarea>
        </div>

        <div id="photoStatus" class="photo-status" hidden></div>

        <div id="manualPhotoZone" class="manual-photo-zone" hidden>
          <p>Aucune photo trouvée sur Wikipédia. Tu peux en ajouter une toi-même :</p>
          <input type="file" id="manualPhotoInput" accept="image/*">
          <div id="manualPreviewWrap"></div>
          <div class="manual-actions">
            <button type="button" id="confirmManualBtn" class="btn btn-primary">Valider la carte</button>
            <button type="button" id="cancelManualBtn" class="btn btn-ghost">Annuler</button>
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" id="submitBtn" class="btn btn-primary">Ajouter au Pokédex</button>
        </div>
      </form>
    </section>

    <section id="screenGallery" class="screen" hidden>
      <div id="galleryEmpty" class="empty-state" hidden>
        <p>Ton Pokédex est vide pour l'instant.</p>
        <button class="btn btn-primary" id="emptyAddBtn">Capturer ma première star</button>
      </div>
      <div id="galleryContent"></div>
    </section>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal">
    <button id="modalClose" class="modal-close" type="button" aria-label="Fermer">×</button>
    <form id="editForm">
      <div class="modal-photo-wrap">
        <img id="modalPhoto" src="" alt="">
        <label class="change-photo-label">Changer la photo
          <input type="file" id="modalPhotoInput" accept="image/*" hidden>
        </label>
      </div>
      <div class="property-row">
        <div class="property-label"><span class="property-icon">Aa</span>Nom</div>
        <input required id="editFullName" type="text">
      </div>
      <div class="property-row">
        <div class="property-label"><span class="property-icon">📅</span>Date</div>
        <input required id="editDate" type="date">
      </div>
      <div class="description-block">
        <div class="block-label">Description</div>
        <textarea id="editDescription" rows="3" placeholder="Ajouter une description..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" id="deleteBtn" class="btn btn-danger">Supprimer</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
  const STORAGE_KEY = 'pokestar_stars_v2';
  const AVATAR_GRADIENTS = [
    ['#FDBB79','#FF6B4A'],
    ['#7EE8CB','#3EC6E0'],
    ['#C9A7FF','#7C6BFF'],
    ['#FFD36E','#FF8A5B'],
    ['#8FD9A8','#3FBF8F'],
    ['#FFB3C7','#FF6B9E'],
    ['#9AD0FF','#5B8DEF'],
    ['#FFE29A','#FFB25B']
  ];
  const AVATAR_TEXT = '#FFFFFF';

  let pendingStar = null;
  let pendingPhotoDataUrl = null;
  let editingId = null;
  let editingPhotoOverride = null;

  // ---------- storage ----------
  function loadStars(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }catch(e){ return []; }
  }
  function persistStars(stars){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stars));
  }
  function saveStar(star){
    const stars = loadStars();
    stars.push({
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
      fullName: star.fullName,
      date: star.date,
      description: star.description || '',
      photoUrl: star.photoUrl || null
    });
    persistStars(stars);
    renderGallery();
  }

  // ---------- helpers ----------
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function hashGradient(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
    return AVATAR_GRADIENTS[Math.abs(h) % AVATAR_GRADIENTS.length];
  }
  function capitalize(str){
    return str.charAt(0).toUpperCase() + str.slice(1);
  }
  function getInitials(fullName){
    const parts = fullName.trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return '?';
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function generateInitialsAvatar(fullName, gradient){
    const initials = getInitials(fullName);
    const gid = 'g' + Math.random().toString(36).slice(2,9);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${gradient[0]}"/>
          <stop offset="100%" stop-color="${gradient[1]}"/>
        </linearGradient>
      </defs>
      <rect width="300" height="300" fill="url(#${gid})"/>
      <text x="150" y="185" font-family="Space Grotesk, sans-serif" font-size="100" font-weight="600"
        fill="${AVATAR_TEXT}" text-anchor="middle">${initials}</text>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  // ---------- Wikipedia lookup ----------
  async function searchWikipediaPhoto(query){
    try{
      const searchRes = await fetch(`https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
      if(!searchRes.ok) return null;
      const searchData = await searchRes.json();
      const title = searchData && searchData.query && searchData.query.search && searchData.query.search[0] && searchData.query.search[0].title;
      if(!title) return null;
      const summaryRes = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
      if(!summaryRes.ok) return null;
      const summaryData = await summaryRes.json();
      return (summaryData.thumbnail && summaryData.thumbnail.source) ||
             (summaryData.originalimage && summaryData.originalimage.source) || null;
    }catch(e){
      return null;
    }
  }

  // ---------- navigation (toggle slide) ----------
  function switchScreen(name){
    const isAdd = name === 'add';
    document.getElementById('screenAdd').hidden = !isAdd;
    document.getElementById('screenGallery').hidden = isAdd;
    document.getElementById('navAdd').classList.toggle('active', isAdd);
    document.getElementById('navGallery').classList.toggle('active', !isAdd);
    document.getElementById('toggleIndicator').classList.toggle('pos-1', !isAdd);
    if(!isAdd) renderGallery();
  }
  document.getElementById('navAdd').addEventListener('click', () => switchScreen('add'));
  document.getElementById('navGallery').addEventListener('click', () => switchScreen('gallery'));
  document.getElementById('emptyAddBtn').addEventListener('click', () => switchScreen('add'));

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
  }

  // ---------- add form ----------
  function showPhotoStatus(msg){
    const el = document.getElementById('photoStatus');
    el.textContent = msg;
    el.hidden = false;
  }
  function hidePhotoStatus(){
    document.getElementById('photoStatus').hidden = true;
  }
  function hideManualZone(){
    document.getElementById('manualPhotoZone').hidden = true;
    document.getElementById('manualPhotoInput').value = '';
    document.getElementById('manualPreviewWrap').innerHTML = '';
    hidePhotoStatus();
  }
  function resetForm(){
    document.getElementById('addForm').reset();
    document.getElementById('metDate').value = new Date().toISOString().slice(0,10);
    hideManualZone();
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value.trim();
    const date = document.getElementById('metDate').value;
    const description = document.getElementById('description').value.trim();
    if(!fullName || !date) return;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Recherche de la photo...';
    showPhotoStatus('Recherche sur Wikipédia...');

    const photoUrl = await searchWikipediaPhoto(fullName);

    if(photoUrl){
      saveStar({ fullName, date, description, photoUrl });
      resetForm();
      showToast(`${fullName} a rejoint le Pokédex`);
    }else{
      pendingStar = { fullName, date, description };
      pendingPhotoDataUrl = null;
      showPhotoStatus('Aucune photo trouvée sur Wikipédia.');
      document.getElementById('manualPhotoZone').hidden = false;
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Ajouter au Pokédex';
  });

  document.getElementById('manualPhotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingPhotoDataUrl = reader.result;
      document.getElementById('manualPreviewWrap').innerHTML =
        `<img src="${reader.result}" class="manual-preview" alt="Aperçu">`;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('confirmManualBtn').addEventListener('click', () => {
    if(!pendingStar) return;
    saveStar({ ...pendingStar, photoUrl: pendingPhotoDataUrl });
    const name = pendingStar.fullName;
    pendingStar = null; pendingPhotoDataUrl = null;
    resetForm();
    showToast(`${name} a rejoint le Pokédex`);
  });

  document.getElementById('cancelManualBtn').addEventListener('click', () => {
    pendingStar = null; pendingPhotoDataUrl = null;
    hideManualZone();
  });

  // ---------- gallery ----------
  function cardHTML(s){
    const gradient = hashGradient(s.fullName);
    const photo = s.photoUrl || generateInitialsAvatar(s.fullName, gradient);
    const dateLabel = new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'short' }).format(new Date(s.date + 'T00:00:00'));
    return `
      <button type="button" class="star-card" data-id="${s.id}">
        <span class="card-photo-wrap"><img src="${photo}" alt="${escapeHtml(s.fullName)}" loading="lazy"></span>
        <span class="card-footer">
          <span class="card-name">${escapeHtml(s.fullName)}</span>
          <span class="card-date">${dateLabel}</span>
        </span>
      </button>
    `;
  }

  function renderGallery(){
    const stars = loadStars();
    document.getElementById('countBadge').textContent = stars.length;

    const empty = document.getElementById('galleryEmpty');
    const grid = document.getElementById('galleryContent');
    empty.hidden = stars.length > 0;
    grid.hidden = stars.length === 0;
    if(stars.length === 0){ grid.innerHTML = ''; return; }

    const groups = {};
    stars.forEach(s => {
      const d = new Date(s.date + 'T00:00:00');
      const key = `${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')}`;
      if(!groups[key]){
        groups[key] = {
          label: capitalize(new Intl.DateTimeFormat('fr-FR', { month:'long', year:'numeric' }).format(d)),
          items: []
        };
      }
      groups[key].items.push(s);
    });

    const orderedKeys = Object.keys(groups).sort((a,b) => b.localeCompare(a));
    grid.innerHTML = orderedKeys.map(key => {
      const g = groups[key];
      g.items.sort((a,b) => new Date(b.date) - new Date(a.date));
      return `
        <div class="month-group">
          <h2 class="month-header">${g.label} <span class="month-count">(${g.items.length})</span></h2>
          <div class="card-grid">${g.items.map(cardHTML).join('')}</div>
        </div>
      `;
    }).join('');

    grid.querySelectorAll('.star-card').forEach(el => {
      el.addEventListener('click', () => openEditModal(el.dataset.id));
    });
  }

  // ---------- edit modal ----------
  function openEditModal(id){
    const stars = loadStars();
    const star = stars.find(s => s.id === id);
    if(!star) return;
    editingId = id;
    editingPhotoOverride = null;

    document.getElementById('editFullName').value = star.fullName;
    document.getElementById('editDate').value = star.date;
    document.getElementById('editDescription').value = star.description || '';
    const gradient = hashGradient(star.fullName);
    document.getElementById('modalPhoto').src = star.photoUrl || generateInitialsAvatar(star.fullName, gradient);

    document.getElementById('modalOverlay').hidden = false;
  }
  function closeModal(){
    document.getElementById('modalOverlay').hidden = true;
    editingId = null;
    editingPhotoOverride = null;
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'modalOverlay') closeModal();
  });

  document.getElementById('modalPhotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      editingPhotoOverride = reader.result;
      document.getElementById('modalPhoto').src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('editForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if(!editingId) return;
    const stars = loadStars();
    const idx = stars.findIndex(s => s.id === editingId);
    if(idx === -1) return;

    stars[idx] = {
      ...stars[idx],
      fullName: document.getElementById('editFullName').value.trim(),
      date: document.getElementById('editDate').value,
      description: document.getElementById('editDescription').value.trim(),
      photoUrl: editingPhotoOverride || stars[idx].photoUrl
    };
    persistStars(stars);
    closeModal();
    renderGallery();
    showToast('Carte mise à jour');
  });

  document.getElementById('deleteBtn').addEventListener('click', () => {
    if(!editingId) return;
    if(!confirm('Supprimer cette carte du Pokédex ?')) return;
    const stars = loadStars().filter(s => s.id !== editingId);
    persistStars(stars);
    closeModal();
    renderGallery();
    showToast('Carte supprimée');
  });

  // ---------- init ----------
  document.getElementById('metDate').value = new Date().toISOString().slice(0,10);
  switchScreen('add');
  renderGallery();
</script>
</body>
</html>
